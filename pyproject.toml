[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "llrpkit"
dynamic = ["version"]
description = "Modern asyncio LLRP toolkit for Impinj RAIN RFID readers (R700, Speedway) — typed client, reader emulator, web dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kyronfeast" }]
keywords = ["rfid", "rain-rfid", "llrp", "impinj", "r700", "speedway", "asyncio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Hardware",
  "Framework :: AsyncIO",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-asyncio>=0.24",
  "hypothesis>=6",
  "mypy>=1.11",
  "ruff>=0.15",
  "pre-commit>=3.8",
  "build>=1.2",
  "twine>=5",
]
docs = [
  "mkdocs-material>=9.5",
]

# [project.urls] intentionally omitted until the GitHub repo goes live (Phase 5).

[project.scripts]
llrpkit = "llrpkit.cli:app"

[tool.hatch.version]
path = "src/llrpkit/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/llrpkit"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PT", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["llrpkit"]

[tool.ruff.format]
# Generated modules are laid out by codegen/generate.py, not the formatter,
# so that `generate.py --check` can prove committed code matches definitions.
exclude = [
  "src/llrpkit/protocol/enums.py",
  "src/llrpkit/protocol/params.py",
  "src/llrpkit/protocol/messages.py",
  "src/llrpkit/protocol/impinj.py",
]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=llrpkit --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["llrpkit"]
branch = true
# Generated protocol tables are exercised representatively (golden vectors,
# property tests, full default-construction sweeps), not line-by-line;
# coverage gates the handwritten code.
omit = [
  "*/llrpkit/protocol/enums.py",
  "*/llrpkit/protocol/params.py",
  "*/llrpkit/protocol/messages.py",
  "*/llrpkit/protocol/impinj.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  'if __name__ == "__main__":',
]
