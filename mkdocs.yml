site_name: llrpkit
site_description: A modern asyncio LLRP toolkit for Impinj RAIN RFID readers.
# site_url and repo_url are set in Phase 5 when the repository goes public.

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Examples: examples.md
  - Field guide:
      - Overview: field-guide/index.md
      - LLRP in plain English: field-guide/llrp-basics.md
      - Sessions & targets: field-guide/sessions-and-targets.md
      - Reader modes: field-guide/reader-modes.md
      - TagFocus & TID: field-guide/tagfocus-and-tid.md
      - Antenna health: field-guide/antenna-health.md
      - R700 onboarding: field-guide/r700-onboarding.md
  - API tour: api.md
  - Contributing: contributing.md
